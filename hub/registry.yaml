# Hub model registry — DISCOVERY ONLY (Round-2 ADR-0019).
#
# Scores NO LONGER live here.  is null for every model whose result has
# not been imported from an immutable, sourced commit (hub/imports/, ADR-0013).
# The only authoritative scores are in hub/canonical_results.json (derived from
# imports + reviews). The README comparison table is regenerated from canonical.
#
# / here are DISPLAY fields carried from v2; the
# authoritative code-vs-model license split lives in each model repo's
# model_card_v2.json  (ADR-0014).
#
# One entry per model repo. Schema (per entry):
#   model_id, name, repo, license, license_category, commercial_use,
#   platforms: { linux-rocm: {badge, overall}, windows-hip: {badge, overall} }
#   badge: verified | community | community-wanted  (legacy display; ADR-0008/0019)
#   overall: OmniDocBench v1.6 score, or null when not yet imported/sourced.

