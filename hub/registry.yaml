# Hub model registry — source of truth for the comparison table.
#
# One entry per model repo. Consumed by scripts/generate_registry.py and
# rendered into a Markdown comparison table (a hosted MkDocs hub site is planned, not yet implemented).
#
# Schema:
#   - model_id:   short identifier used in URLs/table rows (stable key; never displayed as-is — use `name`)
#     name:        official display name (proper casing, per upstream) shown in the Model column
#     repo:        GitHub owner/repo for the per-model ROCm/HIP packaging
#     license:     the MODEL/upstream license shown in the License column (NOT the wrapper-repo code license)
#     platforms:   per-platform support entry
#       linux-rocm:   {badge, overall}
#       windows-hip:  {badge, overall}
#
# badge:   verified | community | community-wanted   (see contracts/badge-policy)
# overall: OmniDocBench v1.6 overall score (number) or null when not yet measured.
#
# License note: `license` reflects the upstream MODEL license (code + weights), matching
# how every row is presented (e.g. MinerU → "MinerU Open Source License", Hunyuan →
# "Tencent Hunyuan Community License"). The per-model AIwork4me packaging repo carries its
# OWN code license (usually MIT/Apache) in its LICENSE/NOTICE — that is the wrapper's license,
# not the model's, and is intentionally separate.
#
# Status: models are onboarded progressively. mineru2.5 reached community on
# linux-rocm (2026-07-21). Others remain community-wanted until onboarded.

- model_id: paddleocr-vl-1.6
  name: PaddleOCR-VL 1.6
  repo: AIwork4me/PaddleOCR-VL-ROCm
  license: Apache-2.0
  license_category: open-source-ai
  commercial_use: no restriction
  platforms:
    linux-rocm: {badge: community, overall: 95.77}
    windows-hip: {badge: community, overall: 95.77}
  note: Upstream PaddleOCR-VL model + weights are Apache-2.0 (verified on the
    PaddlePaddle/PaddleOCR GitHub LICENSE and the PaddlePaddle/PaddleOCR-VL HuggingFace
    card). The AIwork4me/PaddleOCR-VL-ROCm packaging repo is separately MIT (its own
    LICENSE/NOTICE) — that MIT covers only the wrapper code, not the model.

