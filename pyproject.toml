[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnidocbench-rocm"
version = "0.3.3"
description = "OmniDocBench-ROCm: open adaptation, evaluation, reproduction, and collaboration platform for document-parsing models on the AMD ROCm software stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "huggingface_hub>=0.24",
  "jsonschema>=4",
  "pyyaml>=6",
  # rfc3339-validator is the backend jsonschema's FORMAT_CHECKER uses for the
  # `date-time`/`date` formats. It is OPTIONAL in jsonschema — without it the
  # checker is silently unregistered and RFC3339 is NOT enforced (ADR-0007 §3).
  # Declaring it makes provenance.created_at_utc / canonical_result.eval_date
  # validation real on every install (incl. CI). (Fixes CI red on main.)
  "rfc3339-validator>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "cookiecutter>=2", "build"]
download = ["huggingface_hub>=0.24"]

[project.scripts]
omnidocbench-rocm = "omnidocbench_rocm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["engine/omnidocbench_rocm"]

[tool.hatch.build.targets.wheel.force-include]
# Only artifact-schema.json needs force-include — it lives in contracts/ (outside
# the package). cdm/, evalenv/, and data/*.tmpl are INSIDE engine/omnidocbench_rocm/
# and are already shipped by packages = ["engine/omnidocbench_rocm"]; force-including
# them again makes hatchling add them twice (ValueError: second file at same path).
"contracts/artifact-schema.json" = "omnidocbench_rocm/data/artifact-schema.json"
